renderingOptions:
  submitButtonLabel: 'Abmelden'
identifier: mailchimpsignout
label: 'Mailchimp Sign-Out'
type: Form
prototypeName: standard
finishers:
  -
    identifier: MailChimpSignOut
    options:
      oauthClient: '1'
      listId: ''
      server: 'us1'
  -
    identifier: Confirmation
    options:
      message: 'Sie wurden vom Newsletter abgemeldet.'
      contentElementUid: ''
renderables:
  -
    renderingOptions:
      previousButtonLabel: 'previous Page'
      nextButtonLabel: 'next Page'
    identifier: page-1
    label: 'Newsletter-Abmeldung'
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: email
        label: 'E-Mail'
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: 'E-Mail-Adresse'
            required: required
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress