renderingOptions:
  submitButtonLabel: 'Anmelden'
identifier: mailchimpsignin
label: 'Mailchimp Sign-In'
type: Form
prototypeName: standard
finishers:
  -
    identifier: MailChimpSignIn
    options:
      oauthClient: '1'
      listId: ''
      server: 'us1'
  -
    identifier: Confirmation
    options:
      message: 'Vielen Dank. Sie erhalten eine Bestätigungs-E-Mail von Mailchimp.'
      contentElementUid: ''
renderables:
  -
    renderingOptions:
      previousButtonLabel: 'previous Page'
      nextButtonLabel: 'next Page'
    identifier: page-1
    label: 'Newsletter-Anmeldung'
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: 'E-Mail'
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: 'E-Mail-Adresse'
            required: required
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress