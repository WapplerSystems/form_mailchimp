
identifier: mailchimpsignin
type: Form
label: 'Mailchimp Sign-In'
prototypeName: standard
renderingOptions:
  submitButtonLabel: Anmelden
finishers:
  -
    options:
      oauthClient: '1'
      listId: ''
      server: us1
    identifier: MailChimpSignIn
  -
    options:
      message: 'Vielen Dank. Sie erhalten eine Bestätigungs-E-Mail von Mailchimp.'
      contentElementUid: ''
    identifier: Confirmation
renderables:
  -
    renderingOptions:
      previousButtonLabel: 'previous Page'
      nextButtonLabel: 'next Page'
    identifier: page-1
    label: Newsletter-Anmeldung
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: E-Mail
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: E-Mail-Adresse
            required: required
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
variants: {  }
