TYPO3:
  CMS:
    Form:
      prototypes:
        standard:
          formEditor:
            translationFiles:
              2354: 'EXT:form_mailchimp/Resources/Private/Language/form.xlf'
            dynamicJavaScriptModules:
              additionalViewModelModules:
                mailchimp: '@wapplersystems/form-mailchimp/Backend/FormEditor/ConnectionSelectViewModel.js'
          formElementsDefinition:
            Form:
              renderingOptions:
                translation:
                  translationFiles:
                    2354: 'EXT:form_mailchimp/Resources/Private/Language/form.xlf'
              formEditor:
                editors:
                  900:
                    selectOptions:
                      2354:
                        value: MailChimpSignIn
                        label: MailChimp - Sign in
                      2355:
                        value: MailChimpSignOut
                        label: MailChimp - Sign out
                propertyCollections:
                  finishers:
                    2354:
                      identifier: MailChimpSignIn
                      editors:
                        100:
                          label: MailChimp - Sign in
                          identifier: 'header'
                          templateName: 'Inspector-CollectionElementHeaderEditor'
                        200:
                          identifier: oauthClient
                          templateName: Inspector-TextEditor
                          label: 'OAuth Client'
                          propertyPath: options.oauthClient
                        300:
                          identifier: listId
                          templateName: Inspector-TextEditor
                          label: 'List id'
                          propertyPath: options.listId
                        400:
                          identifier: emailField
                          templateName: Inspector-TextEditor
                          label: 'Email form field'
                          placeholder: 'email'
                          propertyPath: options.emailField
                        9999:
                          identifier: 'removeButton'
                          templateName: 'Inspector-RemoveElementEditor'
                    2355:
                      identifier: MailChimpSignOut
                      editors:
                        100:
                          label: MailChimp - Sign out
                          identifier: 'header'
                          templateName: 'Inspector-CollectionElementHeaderEditor'
                        200:
                          identifier: oauthClient
                          templateName: Inspector-TextEditor
                          label: 'OAuth Client'
                          propertyPath: options.oauthClient
                        300:
                          identifier: listId
                          templateName: Inspector-TextEditor
                          label: 'List id'
                          propertyPath: options.listId
                        400:
                          identifier: emailField
                          templateName: Inspector-TextEditor
                          label: 'Email form field'
                          placeholder: 'email'
                          propertyPath: options.emailField
                        9999:
                          identifier: 'removeButton'
                          templateName: 'Inspector-RemoveElementEditor'
          finishersDefinition:
            MailChimpSignIn:
              implementationClassName: WapplerSystems\FormMailchimp\Finishers\MailchimpSignInFormFinisher
              formEditor:
                iconIdentifier: form-finisher-mailchimp
                label: Mailchimp - Sign in
                predefinedDefaults:
                  options:
                    oauthClient: ''
                    listId: ''
                    server: ''
                    emailField: 'email'
              # Exposes per-plugin override field when settings.overrideFinishers=1.
              # Editors override the list ID by translating the form plugin record
              # (sys_language_uid > 0); the localized FlexForm row supplies the
              # value that the standard EXT:form merge picks up at runtime.
              # The select is filled at render time by ListItemsProvider, which
              # reads the form YAML referenced via settings.persistenceIdentifier
              # to find the configured oauthClient and pulls the audiences from
              # Mailchimp on the fly.
              FormEngine:
                label: 'MailChimp - Sign in'
                elements:
                  listId:
                    label: 'Mailchimp List ID'
                    config:
                      type: select
                      renderType: selectSingle
                      itemsProcFunc: 'WapplerSystems\FormMailchimp\Backend\FlexForm\ListItemsProvider->getItems'
                      items: []
            MailChimpSignOut:
              implementationClassName: WapplerSystems\FormMailchimp\Finishers\MailchimpSignOutFormFinisher
              formEditor:
                iconIdentifier: form-finisher-mailchimp
                label: Mailchimp - Sign out
                predefinedDefaults:
                  options:
                    oauthClient: ''
                    listId: ''
                    server: ''
                    emailField: 'email'
              FormEngine:
                label: 'MailChimp - Sign out'
                elements:
                  listId:
                    label: 'Mailchimp List ID'
                    config:
                      type: select
                      renderType: selectSingle
                      itemsProcFunc: 'WapplerSystems\FormMailchimp\Backend\FlexForm\ListItemsProvider->getItems'
                      items: []
      persistenceManager:
        allowedExtensionPaths:
          2354: EXT:form_mailchimp/Resources/Private/Forms/
